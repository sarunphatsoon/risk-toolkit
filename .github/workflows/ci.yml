name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-tests:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  python-module:
    name: Python module and equivalence checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=OFF -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        working-directory: python
        run: python -c "import creditmc_core as c; print(c.irb_asymptotic_loss(0.02, 0.45, 0.15, 0.999))"

      - name: Check VaR/ES models against the Python reference
        working-directory: python
        run: python check_var_models.py

      - name: Check backtests against the Python reference
        working-directory: python
        run: python check_backtests.py

      - name: Check the pandas wrapper against the original pandas code
        working-directory: python
        run: python check_wrapper.py


  pip-install:
    name: pip install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install .

      - name: Import check
        working-directory: python
        run: python -c "import creditmc_core, fast_risk; print(creditmc_core.irb_asymptotic_loss(0.02, 0.45, 0.15, 0.999))"

      - name: Equivalence checks against the installed package
        working-directory: python
        run: |
          python check_var_models.py
          python check_backtests.py
          python check_wrapper.py